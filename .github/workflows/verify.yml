name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git . --redact --log-opts=--all

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            spacetimedb/package-lock.json
            packages/pi-roster/package-lock.json

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix spacetimedb ci
          npm --prefix packages/pi-roster ci

      - name: Install pinned SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version install 2.6.1 --use --yes

      - name: Verify Roster
        run: npm run verify

      - name: Verify Pi control surface
        run: |
          npm --prefix packages/pi-roster test
          npm --prefix packages/pi-roster run typecheck

      - name: Audit production dependencies
        run: |
          # A current Pi shrinkwrap pins brace-expansion 5.0.6. Keep the audit
          # visible while failing CI on critical advisories until upstream can
          # consume 5.0.7 without a postinstall mutation.
          npm audit --omit=dev --audit-level=critical
          npm --prefix packages/pi-roster audit --audit-level=critical

  desktop:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Verify desktop frontend and native shell
        run: npm run desktop:verify
